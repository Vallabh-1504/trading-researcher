[project]
name = "quant-agent"
version = "0.1.0"
description = "QuantTrade Advisor - AI-Assisted Quantitative Research Pipeline for Pairs Trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- Async HTTP & Caching ---
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    # --- Data & Math Stack ---
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "statsmodels>=0.14.0",
    "yfinance>=0.2.40",
    # --- SEC HTML Parsing (NEW - was missing) ---
    # Uses Python's built-in html.parser — no lxml needed
    "beautifulsoup4>=4.12.0",
    # --- LLM Providers ---
    "google-genai>=1.0.0",      # Gemini (primary)
    "openai>=1.40.0",           # OpenRouter + Ollama share the OpenAI-compatible API spec
    # --- LangChain / LangGraph Stack ---
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    # --- RAG / Embedding Stack ---
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    # --- Validation & Config ---
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    # --- CLI UI ---
    "rich>=13.7.0",
    "edgartools>=5.31.5",
    "ragas>=0.3.1",
    "datasets>=4.8.5",
    "langchain-google-vertexai>=3.2.3",
    "pillow>=12.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
